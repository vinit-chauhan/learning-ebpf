name: Build and Publish Docker Image

# Trigger workflow only when a commit/merge to main or master changes the .version file
on:
  push:
    branches:
      - main
      - master
    paths:
      - '.version'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and push Docker image even if .version was not changed in commit'
        required: false
        type: boolean
        default: false

# Define permissions needed for GitHub Container Registry (ghcr.io) and tagging
permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from .version file
        id: version_step
        run: |
          if [ ! -f .version ]; then
            echo "Error: .version file not found!" >&2
            exit 1
          fi
          # Strip leading/trailing whitespaces and newlines
          APP_VERSION=$(tr -d '[:space:]' < .version)
          if [ -z "$APP_VERSION" ]; then
            echo "Error: .version file is empty!" >&2
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Target Release Version: $APP_VERSION"

      - name: Set up QEMU (for multi-architecture support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version_step.outputs.APP_VERSION }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.version_step.outputs.APP_VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag commit with version
        if: success()
        env:
          APP_VERSION: ${{ steps.version_step.outputs.APP_VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="v$APP_VERSION"
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating and pushing Git tag $TAG_NAME..."
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME (Docker Image Published)"
            git push origin "$TAG_NAME" || echo "Tag push skipped or already exists on remote."
          else
            echo "Git tag $TAG_NAME already exists, skipping tag creation."
          fi
